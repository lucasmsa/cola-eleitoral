name: Fix and verify privatization wording (no deploy)

on:
  push:
    branches:
      - fix/compliance-pos-1o-turno
    paths:
      - .github/workflows/fix-privatization-wording.yml

permissions:
  contents: write

concurrency:
  group: compliance-privatization-wording
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.repository == 'lucasmsa/cola-eleitoral' && github.ref == 'refs/heads/fix/compliance-pos-1o-turno'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Correct the source and generated question without changing scoring or evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          old = 'Empresas estatais como a Eletrobras devem ser privatizadas.'
          new = 'Empresas estatais devem ser privatizadas.'
          for filename in ('pipeline/questions.draft.json', 'src/data/questions.json'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              data = json.loads(text)
              questions = data['questions'] if isinstance(data, dict) else data
              matches = [q for q in questions if q['id'] == 'eco-privatizacao']
              assert len(matches) == 1 and matches[0]['statement'] == old, filename
              assert text.count(old) == 1, filename
              updated = text.replace(old, new)
              changed = json.loads(updated)
              changed_questions = changed['questions'] if isinstance(changed, dict) else changed
              next(q for q in changed_questions if q['id'] == 'eco-privatizacao')['statement'] = old
              assert changed == data, f'Unexpected non-statement change: {filename}'
              path.write_text(updated, encoding='utf-8')
          PY
          cat > src/lib/privatizationQuestion.test.ts <<'TS'
          import { describe, expect, it } from 'vitest';
          import draft from '../../pipeline/questions.draft.json';
          import questions from '../data/questions.json';

          describe('privatization question', () => {
            const question = questions.find((item) => item.id === 'eco-privatizacao');

            it('keeps the source and shipped statement general, without calling Eletrobras a current state-owned company', () => {
              const statement = 'Empresas estatais devem ser privatizadas.';
              expect(question?.statement).toBe(statement);
              expect(draft.questions.find((item) => item.id === 'eco-privatizacao')?.statement).toBe(statement);
            });

            it('preserves the existing answer scale and the historical Eletrobras vote references', () => {
              expect(question?.options).toEqual([
                { label: 'Reestatizar o que foi privatizado', value: -1 },
                { label: 'Manter as estatais que existem hoje', value: -0.5 },
                { label: 'Meio-termo, caso a caso', value: 0 },
                { label: 'Privatizar algumas, mantendo as estratégicas', value: 0.5 },
                { label: 'Privatizar a maioria das estatais', value: 1 },
              ]);
              expect(question?.context).toContain('MP 1.031/2021 (privatização da Eletrobras)');
              expect(question?.sources.map((source) => source.url)).toContain(
                'https://dadosabertos.camara.leg.br/api/v2/votacoes/2270789-73',
              );
            });
          });
          TS
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned package manager
        run: npm install --global pnpm@11.21.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Verify unchanged evidence, polls, options, and generated data outside the one statement
        shell: bash
        run: |
          git diff --exit-code -- src/data/evidence.json src/data/polls.json src/data/axes.json src/data/countries.json pipeline/q3/options.json package.json pnpm-lock.yaml
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          for filename in ('pipeline/questions.draft.json', 'src/data/questions.json'):
              before = json.loads(subprocess.check_output(['git', 'show', f'HEAD:{filename}'], text=True))
              after = json.loads(Path(filename).read_text(encoding='utf-8'))
              entries = after['questions'] if isinstance(after, dict) else after
              question = next(q for q in entries if q['id'] == 'eco-privatizacao')
              assert question['statement'] == 'Empresas estatais devem ser privatizadas.'
              question['statement'] = 'Empresas estatais como a Eletrobras devem ser privatizadas.'
              assert before == after, filename
          PY
      - name: Commit only the validated correction to the draft branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pipeline/questions.draft.json src/data/questions.json src/lib/privatizationQuestion.test.ts
          git diff --cached --check
          git commit -m 'fix: remove outdated Eletrobras example from privatization question'
          git push origin HEAD:refs/heads/fix/compliance-pos-1o-turno
          git rev-parse HEAD
